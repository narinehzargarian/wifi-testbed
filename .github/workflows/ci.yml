name: Network tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install network tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            hostapd wpasupplicant iw dnsmasq-base \
            busybox-static iperf3 dnsutils traceroute iproute2 python3-pytest
      - name: Run the test plan
        run: sudo LAB_LOG_DIR=lab-logs python3 -m pytest tests -v --junitxml=results.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results.xml
            lab-logs/
